name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: |
          accounting-data-generator generate             --config config/config.yaml             --profile config/profiles/smoke.yaml             --scenario config/scenarios/baseline.yaml             --output data/generated/ci-smoke
